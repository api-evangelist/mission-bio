notes: >-
  Mission Bio does not distribute its client libraries on PyPI, npm, Maven Central,
  NuGet, RubyGems, Packagist, crates.io or pkg.go.dev. The entire first-party stack
  is published as conda packages on the `missionbio` Anaconda.org channel and is
  installed either with the Mosaic installer downloaded from the Tapestri Portal or
  with `conda create --name mosaic -c missionbio -c conda-forge missionbio.tertiary`.
