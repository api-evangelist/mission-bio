  note: >-
    No written deprecation or support-window policy is published. Breaking changes are
    announced only in the Mosaic release notes and are visible as major-version bumps —
    e.g. 3.0.0 renamed `apply_filter` to `filter_variants` and removed the legacy loom
    conversion and CSV merge functions; 3.4.0 relocated plotting to
    `missionbio.plotting` and NSP to `missionbio.demultiplex.protein.nsp`; 3.17.0
    raised the minimum Python from 3.8 to 3.10.
