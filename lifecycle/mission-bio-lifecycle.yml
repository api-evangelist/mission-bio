method: searched
source: https://missionbio.github.io/mosaic/manual/changelog.html
scope: >-
  Mission Bio ships libraries and instruments, not a hosted web API, so its lifecycle
  contract is a PACKAGE lifecycle (conda versions on the missionbio channel + versioned
  Sphinx docs), not an HTTP API lifecycle. There is no URI/header API version, no
  Sunset/Deprecation header surface, and no published SLA.
