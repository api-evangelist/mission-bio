aid: mission-bio
name: Mission Bio
description: 'Mission Bio is a South San Francisco single-cell multi-omics company
  whose Tapestri Platform simultaneously resolves DNA variants, copy number, protein
  and RNA signal from the same individual cell, for oncology, precision medicine and
  cell-and-gene-therapy research. Its developer surface is not a web API: Mission Bio
  ships a first-party Python analysis stack — Mosaic (tertiary analysis and visualization
  of the Tapestri .h5 file), plus missionbio.h5, missionbio.demultiplex, missionbio.plotting,
  missionbio.annotation, missionbio.filter and a tapestri CLI — distributed on the
  missionbio Anaconda channel and documented at missionbio.github.io. Data is produced
  by the Tapestri Pipeline and managed through the Tapestri Portal; no public REST,
  GraphQL, MCP or event contract is published.'
