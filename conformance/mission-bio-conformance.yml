source: repo artifacts + live probes of every Mission Bio host (2026-08-01)
summary: >-
  Mission Bio publishes no HTTP API contract, so almost every cross-cutting web-API
  standard is inapplicable rather than failed. What it does conform to is a
  bioinformatics file/format stack: HDF5 for the Tapestri .h5 output, conda/CEP
  packaging on the missionbio Anaconda channel, and semver for its libraries. No
  compliance certifications (SOC 2, ISO 27001, ISO 13485, HIPAA, PCI DSS, FedRAMP,
  CSA STAR) were found published on any Mission Bio surface, so NO `Compliance` or
  `TrustCenter` pointer is wired in apis.yml.
